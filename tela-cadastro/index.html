<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="stylestyle.css">
</head>
<body>
    <div class="container-pai">
        <div class="imagem">
           <h2 class="sub-texto-imagem">Simplify The Process. <br>Supercharge The Results.</h2>
           <p class="paragrafo-imagem">Focus On The Picture While Automate The Daily Details.</p>
        </div>
        <div class="forms">
            <h1 class="nome-marca">DREAMLIKE</h1>
            <h2 class="sub-titulo">log in to your account</h2>
            <p>Welcome back Fill in your</p>
            <form action="#" method="post">
                <fieldset>
                    <legend>Or continue with</legend>
                <p><label for="iname">Username</label></p>
                <input type="text" name="iname" id="iname" required class="cadastro01">
                <p><label for="isenha">Password</label></p>
                <input type="password" name="isenha" id="isenha" minlength="8" required class="cadastro02">
                <p>
                <a href="#">Forget Password</a>
                </p>
                <p>
                <input type="submit" value="log in" class="button">
                </p>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
